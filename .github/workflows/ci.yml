name: CI

# Only what is landing on main. The Go job builds an image and restarts a
# container per test, so running it on every push to every branch spent most of
# its budget on work-in-progress that nobody was waiting on. A branch still gets
# checked before it merges, through the pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    name: PHPStan (level 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # openswoole is pinned because setup-php's own default for it is
          # 25.2.0, while composer.lock holds openswoole/core 26.2.0, which
          # requires ext-openswoole >= 26.2.0 — so `composer install` refused the
          # lock file outright and every PHP job died before running anything.
          # The Dockerfile installs the same extension unpinned, i.e. the latest
          # PECL release, which is what 26.2.0 is; bump both together.
          extensions: ds, pdo_mysql, mbstring, iconv, openswoole-26.2.0
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan
        run: composer phpstan

  php-unit:
    name: Pest unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # openswoole is pinned because setup-php's own default for it is
          # 25.2.0, while composer.lock holds openswoole/core 26.2.0, which
          # requires ext-openswoole >= 26.2.0 — so `composer install` refused the
          # lock file outright and every PHP job died before running anything.
          # The Dockerfile installs the same extension unpinned, i.e. the latest
          # PECL release, which is what 26.2.0 is; bump both together.
          extensions: ds, pdo_mysql, mbstring, iconv, openswoole-26.2.0
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pest (unit)
        run: vendor/bin/pest

  go-integration:
    name: Go integration (FlatBuffers, testcontainers)
    runs-on: ubuntu-latest
    # Building the API image and restarting a container per test makes this the
    # slow job by a wide margin; the ceiling is here so a hung container fails
    # rather than burning the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tests/integration/go.sum

      - name: Install flatc
        run: |
          FLATC_VERSION=25.12.19
          curl -fsSL -o /tmp/flatc.zip \
            "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip"
          sudo unzip -o /tmp/flatc.zip -d /usr/local/bin
          flatc --version

      - name: Verify generated Go bindings are up to date
        run: |
          scripts/generate-flatbuffers-go.sh
          git diff --exit-code tests/integration/internal/fbs \
            || (echo "::error::Go FlatBuffers bindings are stale — run scripts/generate-flatbuffers-go.sh" && exit 1)

      - name: Run integration suite
        run: scripts/integration-test.sh
