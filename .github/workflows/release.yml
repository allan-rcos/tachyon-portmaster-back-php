name: Release

# Two triggers, one job, on purpose. A tag publishes; a push to main runs the
# very same build as a *check* and stops before publishing. Without that second
# trigger the artifact would only ever be assembled on the day of a release,
# which is the worst day to discover that assembling it is broken.
on:
  push:
    tags: ["v*"]
    branches: [main]

jobs:
  artifact:
    name: Build the production artifact
    runs-on: ubuntu-latest
    # Alpine, to match the musl of the target the tarball is deployed to.
    container: alpine:3.22
    permissions:
      # softprops/action-gh-release creates a release with the automatic
      # GITHUB_TOKEN — no secret is involved — but the default token is
      # read-only, so without this the publish step fails with a 403.
      contents: write
    steps:
      # Three things about this Alpine cost an afternoon each if discovered
      # from a red build rather than read here:
      #
      #   1. Alpine's `composer` package is wired to php83 — its wrapper calls
      #      /usr/bin/php83 — so the build would silently run on the wrong PHP.
      #      Hence the official composer.phar under php84.
      #   2. php84 does not ship the openssl extension, and without it every
      #      HTTPS download from inside PHP dies with "Unable to find the
      #      socket transport ssl", which reads like a network fault.
      #   3. bash is not installed. The scripts in scripts/ are bash by
      #      convention, and busybox sh does not understand `set -o pipefail`.
      - name: Install the toolchain
        run: |
          apk add --no-cache \
            php84 php84-phar php84-openssl php84-mbstring php84-iconv \
            php84-tokenizer php84-dom php84-xml php84-xmlwriter \
            php84-pecl-ds php84-curl php84-session php84-fileinfo \
            php84-pdo php84-pdo_mysql \
            bash git curl tar zstd coreutils findutils gawk
          ln -sf /usr/bin/php84 /usr/local/bin/php
          curl -fsSL https://getcomposer.org/download/2.8.10/composer.phar \
            -o /usr/local/bin/composer
          chmod +x /usr/local/bin/composer

      # No `submodules: recursive` here, unlike every job in ci.yml: this
      # workflow generates nothing from the schemas — src/API/Fbs/ is committed.
      # fetch-depth: 0 is what `git describe` needs to name an untagged build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: scripts/build-dist.sh "${GITHUB_REF_NAME#v}"

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.zst
            dist/*.tar.zst.sha256
