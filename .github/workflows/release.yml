name: Release

# One job, and what it does depends on the version rather than on ceremony.
#
# Every push to main builds the artifact — the build has to be exercised on
# ordinary days, because release day is the worst one to discover that
# assembling it is broken. Whether that build is also *published* is decided by
# `version` in composer.json: if no tag `v<version>` exists yet, this run cuts
# the release and creates the tag; if one exists, the build stops after proving
# it still works. Pushing a tag by hand keeps working and publishes that tag.
#
# The condition is "the tag does not exist yet", not "composer.json changed in
# this push". They agree on the normal path, and the first one keeps being right
# when a run is retried, when several commits land at once, or when history is
# rewritten — and it is what makes a release never overwrite an existing one.
on:
  push:
    tags: ["v*"]
    branches: [main]

# Two pushes landing together must not both decide the tag is missing and race
# to create it.
concurrency:
  group: release-${{ github.ref }}

env:
  # Pinned to the version the modules under dagger/ were generated against.
  DAGGER_VERSION: "0.21.8"

jobs:
  artifact:
    name: Build the production artifact
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release creates a release with the automatic
      # GITHUB_TOKEN — no secret is involved — but the default token is
      # read-only, so without this the publish step fails with a 403.
      contents: write
    steps:
      # This job used to run *inside* `container: alpine:3.22`, and carried a
      # long comment about three Alpine footguns: that its `composer` package is
      # wired to php83, that php84 ships without openssl, and that bash is not
      # installed. None of that is this file's business any more — the Alpine
      # toolchain is `dagger/modules/toolchain`, where those three decisions live
      # next to the code that depends on them, and the same module is what a
      # developer gets from `dagger call dist` on their own machine. The build
      # itself — staging, vendor pruning, `php -w` minification, reproducible
      # tar — is `dagger/modules/artifact`, in Go.
      #
      # No `submodules: recursive`, unlike ci.yml: this workflow generates
      # nothing from the schemas — src/API/Fbs/ is committed. The default shallow
      # checkout is enough; nothing here reads history, and the tag question is
      # asked of the remote below.
      - uses: actions/checkout@v4

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR=/usr/local/bin sudo -E sh
          dagger version

      # The version is declared in composer.json, and `dagger call version`
      # reads that same field — no PHP or jq on the runner just to read one
      # key of one JSON file. This step only asks whether that version has been
      # released already. `git ls-remote`
      # rather than a local tag list, so the answer is what is actually
      # published and not what this checkout happens to have fetched.
      - name: Decide the version and whether it is new
        id: version
        working-directory: dagger
        run: |
          version="$(dagger call version)"
          [ -n "$version" ] && [ "$version" != null ] \
            || { echo "composer.json declares no version" >&2; exit 1; }

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
            echo "building tag $GITHUB_REF_NAME"
          elif git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            publish=false
            echo "v${version} is already released — building as a check, publishing nothing"
          else
            publish=true
            echo "v${version} has no tag yet — this build publishes it"
          fi
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

      # Dagger never writes to the host on its own, so the artifact is exported
      # explicitly — and only if the build succeeded, which is what keeps a
      # half-written tarball from ever reaching the release.
      - name: Build
        working-directory: dagger
        run: dagger call dist --version "${{ steps.version.outputs.version }}" export --path ../dist

      # tag_name creates the tag on this commit when it does not exist, so
      # cutting a release is a change to composer.json and nothing else. The
      # step is skipped outright when the version is already out, which is what
      # keeps a published release from ever being overwritten.
      - if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.zst
            dist/*.tar.zst.sha256
